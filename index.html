<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPTCG Analyzer - análise de decks do One Piece Card Game</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="topo">
  <div class="topo-marca">
    <h1>OPTCG <span>Analyzer</span></h1>
    <p class="topo-sub">Análise dos decks que deram top, direto do onepiecetopdecks.com</p>
  </div>
  <div class="topo-status" id="status">
    <span class="carregando">carregando dados…</span>
  </div>
</header>

<nav class="abas" id="abas">
  <button class="aba ativa" data-tela="meta">Meta</button>
  <button class="aba" data-tela="cartas">Cartas</button>
  <button class="aba" data-tela="consenso">Deck consenso</button>
  <button class="aba" data-tela="decks">Decks</button>
  <button class="aba" data-tela="comparar">Comparar</button>
</nav>

<section class="filtros" id="filtros">
  <div class="filtro">
    <label for="f-formato">Formato</label>
    <select id="f-formato"><option value="">Todos</option></select>
  </div>
  <div class="filtro">
    <label for="f-regiao">Região</label>
    <select id="f-regiao"><option value="">Todas</option></select>
  </div>
  <div class="filtro filtro-largo">
    <label>Tipo de torneio</label>
    <div class="chips" id="f-torneios"></div>
  </div>
  <div class="filtro">
    <label for="f-periodo">Período</label>
    <select id="f-periodo">
      <option value="0">Tudo</option>
      <option value="14">Últimos 14 dias</option>
      <option value="30">Últimos 30 dias</option>
      <option value="60">Últimos 60 dias</option>
      <option value="90">Últimos 90 dias</option>
    </select>
  </div>
  <div class="filtro filtro-caixas">
    <label class="caixa"><input type="checkbox" id="f-completos" checked> Só decks com 50 cartas</label>
    <label class="caixa"><input type="checkbox" id="f-semsim" checked> Excluir simulador</label>
  </div>
  <div class="filtro filtro-resumo">
    <span id="resumo-filtro">—</span>
    <button class="btn-limpar" id="btn-limpar">limpar filtros</button>
  </div>
</section>

<main id="conteudo">
  <div class="aviso" id="aviso-carregando">
    <div class="spinner"></div>
    <p>Lendo o banco de dados…</p>
  </div>
</main>

<footer class="rodape">
  <p>
    Dados de decklist: <a href="https://onepiecetopdecks.com/deck-list/" target="_blank" rel="noopener">onepiecetopdecks.com</a> ·
    Dados de carta: <a href="https://en.onepiece-cardgame.com/cardlist/" target="_blank" rel="noopener">lista oficial Bandai</a>.
    Projeto de fã, sem vínculo com a Bandai ou a Toei.
  </p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
