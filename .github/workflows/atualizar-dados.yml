# Roda os robôs de coleta e salva os dados novos no próprio repositório.
# É isto que faz o site se manter atualizado sozinho, sem você abrir o PC.
name: Atualizar dados

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília. Roda todo dia.
    - cron: '0 6 * * *'
  # Permite rodar na mão pelo botão "Run workflow" na aba Actions.
  workflow_dispatch:

# Sem isto a Action não consegue salvar (fazer commit) no repositório.
permissions:
  contents: write

# Evita duas execuções ao mesmo tempo brigando pelo mesmo commit.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Coletar as cartas (site oficial da Bandai)
        run: node scripts/coletar-cartas.mjs

      # As três coletas abaixo usam continue-on-error de propósito: se um dos
      # sites sair do ar ou mudar de formato, as outras fontes seguem atualizando
      # e a junção reaproveita o último arquivo bom da fonte que falhou.
      - name: Coletar decklists do gumgum.gg
        id: gumgum
        continue-on-error: true
        run: node scripts/coletar-gumgum.mjs

      - name: Coletar decklists do onepiecetopdecks.com
        id: topdecks
        continue-on-error: true
        run: node scripts/coletar-decks.mjs

      - name: Avisar se as duas fontes falharam
        if: steps.gumgum.outcome == 'failure' && steps.topdecks.outcome == 'failure'
        run: |
          echo "As duas fontes de decklist falharam. Nada de novo para salvar."
          exit 1

      - name: Juntar as fontes num só banco
        run: node scripts/juntar-decks.mjs

      - name: Salvar o que mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nada mudou desde a última coleta."
          else
            decks=$(node -p "require('./data/decks.json').total")
            cartas=$(node -p "require('./data/cartas.json').total")
            git commit -m "dados: ${decks} decks e ${cartas} cartas ($(date -u '+%d/%m/%Y'))"
            git push
            echo "Dados atualizados: ${decks} decks, ${cartas} cartas."
          fi

      - name: Resumo
        if: always()
        run: |
          echo "### Coleta do dia" >> $GITHUB_STEP_SUMMARY
          echo "- gumgum.gg: ${{ steps.gumgum.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- onepiecetopdecks.com: ${{ steps.topdecks.outcome }}" >> $GITHUB_STEP_SUMMARY
